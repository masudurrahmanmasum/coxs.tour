<!doctype html>

<html lang="bn">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Registered Students | Cox's Bazar Tour</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;

        font-family: "Hind Siliguri", sans-serif;

        background: linear-gradient(135deg, #061923, #0a2938, #06141e);

        color: white;

        padding: 30px;
      }

      /* =========================================
           HEADER
           ========================================= */

      .header {
        max-width: 1100px;

        margin: auto;

        display: flex;

        justify-content: space-between;

        align-items: center;

        margin-bottom: 30px;
      }

      .header small {
        color: #61e6fa;

        font-family: Poppins;
      }

      .header h1 {
        font-family: Poppins;

        font-size: 30px;

        margin-top: 5px;
      }

      .refresh-btn {
        border: 1px solid #26d7ed;

        background: transparent;

        color: white;

        padding: 10px 18px;

        border-radius: 25px;

        cursor: pointer;
      }

      .refresh-btn:hover {
        background: #18cfe6;
      }

      /* =========================================
           SUMMARY
           ========================================= */

      .summary {
        max-width: 1100px;

        margin: auto;

        display: grid;

        grid-template-columns: repeat(3, 1fr);

        gap: 18px;
      }

      .summary-card {
        padding: 22px;

        border-radius: 18px;

        background: rgba(255, 255, 255, 0.06);

        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .summary-card span {
        color: rgba(255, 255, 255, 0.55);
      }

      .summary-card strong {
        display: block;

        font-family: Poppins;

        font-size: 38px;

        margin-top: 5px;
      }

      #totalCount {
        color: #61e6fa;
      }

      #presentCount {
        color: #42e29a;
      }

      #absentCount {
        color: #ff6e7c;
      }

      /* =========================================
           FILTER
           ========================================= */

      .filters {
        max-width: 1100px;

        margin: 25px auto 15px;

        display: flex;

        gap: 10px;
      }

      .filter-btn {
        border: 1px solid rgba(255, 255, 255, 0.15);

        background: rgba(255, 255, 255, 0.06);

        color: white;

        padding: 9px 18px;

        border-radius: 25px;

        cursor: pointer;
      }

      .filter-btn.active {
        background: #14cde3;

        border-color: #14cde3;
      }

      /* =========================================
           SEARCH
           ========================================= */

      .search {
        max-width: 1100px;

        margin: 0 auto 20px;
      }

      .search input {
        width: 100%;

        padding: 15px 20px;

        border-radius: 15px;

        border: 1px solid rgba(255, 255, 255, 0.12);

        background: rgba(255, 255, 255, 0.06);

        color: white;

        outline: none;

        font-family: "Hind Siliguri";

        font-size: 15px;
      }

      /* =========================================
           STUDENT LIST
           ========================================= */

      #studentList {
        max-width: 1100px;

        margin: auto;

        display: flex;

        flex-direction: column;

        gap: 10px;
      }

      .student {
        display: grid;

        grid-template-columns:
          50px
          1fr
          180px
          230px;

        align-items: center;

        gap: 15px;

        padding: 14px 18px;

        background: rgba(255, 255, 255, 0.05);

        border: 1px solid rgba(255, 255, 255, 0.08);

        border-radius: 15px;
      }

      .student-number {
        width: 35px;

        height: 35px;

        border-radius: 50%;

        display: flex;

        justify-content: center;

        align-items: center;

        background: rgba(30, 210, 235, 0.12);

        color: #62e7fa;

        font-family: Poppins;
      }

      .student-name {
        font-size: 17px;

        font-weight: 600;
      }

      .student-mobile {
        color: rgba(255, 255, 255, 0.55);

        font-family: Poppins;

        font-size: 13px;
      }

      /* =========================================
           ATTENDANCE BUTTONS
           ========================================= */

      .attendance {
        display: flex;

        justify-content: flex-end;

        gap: 8px;
      }

      .attendance button {
        padding: 8px 13px;

        border-radius: 20px;

        border: 1px solid rgba(255, 255, 255, 0.15);

        background: rgba(255, 255, 255, 0.05);

        color: rgba(255, 255, 255, 0.65);

        cursor: pointer;
      }

      .attendance .present.active {
        background: #159d68;

        color: white;

        border-color: #40e3a0;
      }

      .attendance .absent.active {
        background: #b53f4e;

        color: white;

        border-color: #ff7180;
      }

      /* =========================================
           LOADING
           ========================================= */

      #loading {
        text-align: center;

        padding: 50px;

        color: rgba(255, 255, 255, 0.6);
      }

      #noData {
        display: none;

        text-align: center;

        padding: 50px;

        color: rgba(255, 255, 255, 0.5);
      }

      /* =========================================
           MOBILE
           ========================================= */

      @media (max-width: 700px) {
        body {
          padding: 18px;
        }

        .header {
          align-items: flex-start;
        }

        .header h1 {
          font-size: 22px;
        }

        .summary {
          grid-template-columns: 1fr;
        }

        .student {
          grid-template-columns: 40px 1fr;
        }

        .student-mobile {
          grid-column: 2;
        }

        .attendance {
          grid-column: 2;

          justify-content: flex-start;
        }
      }

      /* =========================================
           MOBILE NUMBER PRIVACY
         ========================================= */

      .student-mobile-wrap {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 8px;
        min-width: 0;
      }

      .student-mobile {
        color: rgba(255, 255, 255, 0.55);
        font-family: Poppins;
        font-size: 13px;
        cursor: pointer;
        user-select: none;
        transition: 0.25s ease;
        border: 0;
        background: transparent;
        padding: 4px 6px;
        border-radius: 8px;
        text-align: left;
      }

      .student-mobile:hover {
        color: #61e6fa;
        background: rgba(97, 230, 250, 0.08);
      }

      .student-mobile.locked {
        color: rgba(255, 255, 255, 0.45);
        filter: blur(5px);
        cursor: pointer;
      }

      .student-mobile.unlocked {
        filter: none;
        color: rgba(255, 255, 255, 0.75);
        cursor: default;
      }

      .copy-mobile-btn {
        width: 30px;
        height: 30px;
        display: none;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(97, 230, 250, 0.25);
        border-radius: 8px;
        background: rgba(97, 230, 250, 0.08);
        color: #61e6fa;
        cursor: pointer;
        transition: 0.2s ease;
        flex-shrink: 0;
      }

      .copy-mobile-btn.visible {
        display: inline-flex;
      }

      .copy-mobile-btn:hover {
        background: #14cde3;
        color: #061923;
        transform: translateY(-1px);
      }

      .copy-mobile-btn svg {
        width: 15px;
        height: 15px;
        pointer-events: none;
      }

      /* =========================================
           SECRET CODE MODAL
         ========================================= */

      .secret-modal {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: rgba(0, 0, 0, 0.72);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }

      .secret-modal.show {
        display: flex;
        animation: modalFadeIn 0.2s ease;
      }

      .secret-box {
        width: min(100%, 390px);
        padding: 28px;
        border-radius: 22px;
        background: linear-gradient(145deg, #0b2736, #071923);
        border: 1px solid rgba(97, 230, 250, 0.2);
        box-shadow: 0 25px 70px rgba(0, 0, 0, 0.45);
        position: relative;
        animation: modalScaleIn 0.22s ease;
      }

      .secret-icon {
        width: 52px;
        height: 52px;
        margin: 0 auto 15px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 16px;
        background: rgba(97, 230, 250, 0.1);
        color: #61e6fa;
      }

      .secret-icon svg {
        width: 25px;
        height: 25px;
      }

      .secret-box h2 {
        text-align: center;
        font-family: Poppins;
        font-size: 20px;
        margin-bottom: 7px;
      }

      .secret-box p {
        text-align: center;
        color: rgba(255, 255, 255, 0.55);
        font-size: 14px;
        margin-bottom: 20px;
      }

      .secret-input {
        width: 100%;
        padding: 13px 15px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.13);
        outline: none;
        background: rgba(255, 255, 255, 0.06);
        color: white;
        font-family: Poppins;
        font-size: 15px;
        text-align: center;
        letter-spacing: 2px;
        transition: 0.2s ease;
      }

      .secret-input:focus {
        border-color: #61e6fa;
        box-shadow: 0 0 0 3px rgba(97, 230, 250, 0.08);
      }

      .secret-error {
        min-height: 20px;
        margin-top: 8px;
        color: #ff7180;
        text-align: center;
        font-size: 13px;
      }

      .secret-actions {
        display: flex;
        gap: 10px;
        margin-top: 10px;
      }

      .secret-actions button {
        flex: 1;
        padding: 11px 15px;
        border-radius: 12px;
        cursor: pointer;
        font-family: "Hind Siliguri", sans-serif;
        font-size: 14px;
        border: 1px solid rgba(255, 255, 255, 0.13);
      }

      .secret-cancel {
        background: rgba(255, 255, 255, 0.06);
        color: rgba(255, 255, 255, 0.75);
      }

      .secret-submit {
        background: #14cde3;
        color: #061923;
        border-color: #14cde3 !important;
        font-weight: 600;
      }

      .secret-submit:hover {
        background: #61e6fa;
      }

      .secret-cancel:hover {
        background: rgba(255, 255, 255, 0.1);
      }

      @keyframes modalFadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      @keyframes modalScaleIn {
        from {
          opacity: 0;
          transform: scale(0.94) translateY(8px);
        }
        to {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }

      /* Copy notification */
      .copy-toast {
        position: fixed;
        left: 50%;
        bottom: 28px;
        z-index: 10000;
        transform: translateX(-50%) translateY(15px);
        opacity: 0;
        pointer-events: none;
        padding: 10px 17px;
        border-radius: 12px;
        background: #159d68;
        color: white;
        font-size: 14px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        transition: 0.25s ease;
      }

      .copy-toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      @media (max-width: 700px) {
        .student-mobile-wrap {
          grid-column: 2;
        }

        .student-mobile {
          max-width: 180px;
        }

        .secret-box {
          padding: 24px 20px;
        }
      }

    </style>
  </head>

  <body>
    <!-- HEADER -->

    <header class="header">
      <div>
        <small> Cox's Bazar Tour 2026 </small>

        <h1>Our Tour Partners</h1>
      </div>

      <button class="refresh-btn" id="refreshBtn">↻ Refresh</button>
    </header>

    <!-- SUMMARY -->

    <section class="summary">
      <div class="summary-card">
        <span> Total Friends </span>

        <strong id="totalCount"> 0 </strong>
      </div>

      <div class="summary-card">
        <span> With Us </span>

        <strong id="presentCount"> 0 </strong>
      </div>

      <div class="summary-card">
        <span> Out Of Circle </span>

        <strong id="absentCount"> 0 </strong>
      </div>
    </section>

    <!-- FILTER -->

<div class="filters">

    <button class="filter-btn active" id="allStudentsBtn" data-filter="all">
        All Friends
    </button>

    <button class="filter-btn" id="allOutBtn" data-filter="present">
        With Us
    </button>

    <button class="filter-btn" id="absentBtn" data-filter="absent">
        Out Of Circle
    </button>

    <button class="filter-btn all-absent-btn" id="allAbsentBtn">
    Hang Out
</button>

</div>

    <!-- SEARCH -->

    <div class="search">
      <input
        type="text"
        id="searchInput"
        placeholder="স্টুডেন্টের নাম অথবা মোবাইল দিয়ে খুঁজুন..."
      />
    </div>

    <!-- LOADING -->

    <div id="loading">Student data loading...</div>

    <!-- STUDENT LIST -->

    <main id="studentList"></main>

    <!-- NO DATA -->

    <div id="noData">কোনো student পাওয়া যায়নি।</div>


    <!-- SECRET CODE MODAL -->
    <div class="secret-modal" id="secretModal" aria-hidden="true">
      <div class="secret-box" role="dialog" aria-modal="true" aria-labelledby="secretTitle">
        <div class="secret-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="4" y="10" width="16" height="10" rx="2"></rect>
            <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
          </svg>
        </div>

        <h2 id="secretTitle">Secret Code Required</h2>
        <p>এই স্টুডেন্টের মোবাইল নম্বর দেখতে Secret Code দিন।</p>

        <input
          type="password"
          id="secretCodeInput"
          class="secret-input"
          placeholder="Secret Code"
          autocomplete="off"
        />

        <div class="secret-error" id="secretError"></div>

        <div class="secret-actions">
          <button class="secret-cancel" id="secretCancel" type="button">
            Cancel
          </button>
          <button class="secret-submit" id="secretSubmit" type="button">
            Verify
          </button>
        </div>
      </div>
    </div>

    <div class="copy-toast" id="copyToast">মোবাইল নম্বর কপি হয়েছে ✓</div>

    <script>
      /* =========================================
   GOOGLE APPS SCRIPT WEB APP URL
========================================= */

      const GOOGLE_SCRIPT_URL =
        "https://script.google.com/macros/s/AKfycbxTbblEz80RNybzYvdg-6nj3ejdrG6P__3ioj6Sbrgp5VzS2GbzCCddA_-giRh99_wT3Q/exec";

      /* =========================================
   VARIABLES
========================================= */

      let students = [];

      let currentFilter = "all";

      let searchText = "";

      /* =========================================
           MOBILE PRIVACY SETTINGS
         ========================================= */

      // এখানে নিজের Secret Code বসান
      const MOBILE_SECRET_CODE = "2511";

      // এই Set-এ যেসব student unlock হয়েছে তাদের row রাখা হবে
      const unlockedStudents = new Set();

      let selectedStudent = null;
      let selectedMobileButton = null;
      let selectedCopyButton = null;

      /* =========================================
   LOAD STUDENTS
========================================= */

      function loadStudents() {
        const loading = document.getElementById("loading");

        if (loading) {
          loading.style.display = "block";
        }

        const callbackName = "studentCallback_" + Date.now();

        window[callbackName] = function (response) {
          console.log("Google Sheet Response:", response);

          if (!response || response.success !== true) {
            console.error("Data loading failed:", response);

            showError(
              response && response.message
                ? response.message
                : "Student data load করা যায়নি।",
            );

            if (loading) {
              loading.style.display = "none";
            }

            delete window[callbackName];

            return;
          }

          /*
           * Google Sheet থেকে পাওয়া students
           */

          students = response.students || [];

          console.log("Students:", students);

          updateSummary();

          renderStudents();

          if (loading) {
            loading.style.display = "none";
          }

          delete window[callbackName];
        };

        const script = document.createElement("script");

        script.src =
          GOOGLE_SCRIPT_URL +
          "?action=students" +
          "&callback=" +
          callbackName +
          "&_=" +
          Date.now();

        script.onerror = function () {
          console.error("Apps Script request failed.");

          showError("Google Apps Script থেকে data পাওয়া যাচ্ছে না।");

          if (loading) {
            loading.style.display = "none";
          }

          delete window[callbackName];
        };

        document.body.appendChild(script);
      }

      /* =========================================
   RENDER STUDENTS
========================================= */

      function renderStudents() {
        const container = document.getElementById("studentList");

        if (!container) {
          console.error("studentList পাওয়া যায়নি");
          return;
        }

        container.innerHTML = "";

        const searchInput = document.getElementById("searchInput");

        const searchText = searchInput
          ? searchInput.value.trim().toLowerCase()
          : "";

        const filteredStudents = students.filter(function (student) {
          const name = String(student.name || "").toLowerCase();

          const mobile = String(student.mobile || "").toLowerCase();

          /* Search */

          if (
            searchText &&
            !name.includes(searchText) &&
            !mobile.includes(searchText)
          ) {
            return false;
          }

          /* Present */

          if (currentFilter === "present") {
            return student.attendance === "Present";
          }

          /* Absent */

          if (currentFilter === "absent") {
            return student.attendance === "Absent";
          }

          return true;
        });

        /* No data */

        const noData = document.getElementById("noData");

        if (filteredStudents.length === 0) {
          noData.style.display = "block";

          return;
        }

        noData.style.display = "none";

        /* =====================================
       CREATE STUDENT
    ===================================== */

        filteredStudents.forEach(function (student, index) {
          const row = document.createElement("div");

          /*
           * CSS-এর সাথে matching class
           */

          row.className = "student";

          /* =================================
               NUMBER
            ================================= */

          const number = document.createElement("div");

          number.className = "student-number";

          /*
           * এখানে শুধু number থাকবে
           * "Student #1" নয়
           */

          number.textContent = index + 1;

          /* =================================
               NAME
            ================================= */

          const name = document.createElement("div");

          name.className = "student-name";

          name.textContent = student.name || "Unknown";

          /* =================================
               MOBILE
            ================================= */

          const mobileWrap = document.createElement("div");
          mobileWrap.className = "student-mobile-wrap";

          const mobile = document.createElement("button");
          mobile.type = "button";
          mobile.className = "student-mobile locked";

          const mobileValue = student.mobile
            ? "0" + String(student.mobile).replace(/^0+/, "")
            : "";

          if (mobileValue) {
            mobile.textContent = "📱 " + mobileValue;
            mobile.title = "মোবাইল নম্বর দেখতে ক্লিক করুন";
            mobile.dataset.row = student.row;
            mobile.addEventListener("click", function () {
              requestMobileAccess(student, mobile, copyButton, mobileValue);
            });
          } else {
            mobile.textContent = "Mobile unavailable";
            mobile.classList.remove("locked");
            mobile.disabled = true;
          }

          const copyButton = document.createElement("button");
          copyButton.type = "button";
          copyButton.className = "copy-mobile-btn";
          copyButton.title = "মোবাইল নম্বর কপি করুন";
          copyButton.setAttribute("aria-label", "Copy mobile number");
          copyButton.innerHTML = `
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="9" y="9" width="11" height="11" rx="2"></rect>
              <path d="M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1"></path>
            </svg>
          `;

          copyButton.addEventListener("click", function (event) {
            event.stopPropagation();
            copyMobileNumber(mobileValue);
          });

          if (unlockedStudents.has(String(student.row))) {
            unlockMobile(mobile, copyButton, mobileValue);
          }

          mobileWrap.appendChild(mobile);
          mobileWrap.appendChild(copyButton);

          /* =================================
               ATTENDANCE
            ================================= */

          const attendance = document.createElement("div");

          attendance.className = "attendance";

          /* =================================
               PRESENT BUTTON
            ================================= */

          const presentButton = document.createElement("button");

          presentButton.className = "present";

          presentButton.textContent = "Present";

          if (student.attendance === "Present") {
            presentButton.classList.add("active");
          }

          presentButton.addEventListener("click", function () {
            saveAttendance(student, "Present");
          });

          /* =================================
               ABSENT BUTTON
            ================================= */

          const absentButton = document.createElement("button");

          absentButton.className = "absent";

          absentButton.textContent = "Absent";

          if (student.attendance === "Absent") {
            absentButton.classList.add("active");
          }

          absentButton.addEventListener("click", function () {
            saveAttendance(student, "Absent");
          });

          /* =================================
               APPEND BUTTONS
            ================================= */

          attendance.appendChild(presentButton);

          attendance.appendChild(absentButton);

          /* =================================
               APPEND STUDENT
            ================================= */

          row.appendChild(number);

          row.appendChild(name);

          row.appendChild(mobileWrap);

          row.appendChild(attendance);

          container.appendChild(row);
        });
      }

      /* =========================================
           MOBILE NUMBER PRIVACY FUNCTIONS
         ========================================= */

      function requestMobileAccess(student, mobileButton, copyButton, mobileValue) {
        const rowKey = String(student.row);

        if (unlockedStudents.has(rowKey)) {
          return;
        }

        selectedStudent = student;
        selectedMobileButton = mobileButton;
        selectedCopyButton = copyButton;

        const modal = document.getElementById("secretModal");
        const input = document.getElementById("secretCodeInput");
        const error = document.getElementById("secretError");

        error.textContent = "";
        input.value = "";

        modal.classList.add("show");
        modal.setAttribute("aria-hidden", "false");

        setTimeout(function () {
          input.focus();
        }, 50);
      }

      function verifySecretCode() {
        const input = document.getElementById("secretCodeInput");
        const error = document.getElementById("secretError");

        if (input.value.trim() !== MOBILE_SECRET_CODE) {
          error.textContent = "Secret Code সঠিক নয়। আবার চেষ্টা করুন।";
          input.value = "";
          input.focus();
          return;
        }

        if (selectedStudent && selectedMobileButton && selectedCopyButton) {
          const rowKey = String(selectedStudent.row);
          const mobileValue = selectedStudent.mobile
            ? "0" + String(selectedStudent.mobile).replace(/^0+/, "")
            : "";

          unlockedStudents.add(rowKey);
          unlockMobile(selectedMobileButton, selectedCopyButton, mobileValue);
        }

        closeSecretModal();
      }

      function unlockMobile(mobileButton, copyButton, mobileValue) {
        mobileButton.classList.remove("locked");
        mobileButton.classList.add("unlocked");
        mobileButton.textContent = "📱 " + mobileValue;
        mobileButton.title = "মোবাইল নম্বর";
        mobileButton.disabled = false;

        copyButton.classList.add("visible");
      }

      function closeSecretModal() {
        const modal = document.getElementById("secretModal");
        const input = document.getElementById("secretCodeInput");
        const error = document.getElementById("secretError");

        modal.classList.remove("show");
        modal.setAttribute("aria-hidden", "true");

        input.value = "";
        error.textContent = "";

        selectedStudent = null;
        selectedMobileButton = null;
        selectedCopyButton = null;
      }

      async function copyMobileNumber(mobileNumber) {
        if (!mobileNumber) return;

        try {
          await navigator.clipboard.writeText(mobileNumber);
          showCopyToast();
        } catch (error) {
          const tempInput = document.createElement("input");
          tempInput.value = mobileNumber;
          document.body.appendChild(tempInput);
          tempInput.select();
          document.execCommand("copy");
          tempInput.remove();
          showCopyToast();
        }
      }

      function showCopyToast() {
        const toast = document.getElementById("copyToast");

        toast.classList.add("show");

        setTimeout(function () {
          toast.classList.remove("show");
        }, 1800);
      }

      /* =========================================
           SECRET MODAL EVENTS
         ========================================= */

      document.getElementById("secretSubmit").addEventListener("click", verifySecretCode);

      document.getElementById("secretCancel").addEventListener("click", closeSecretModal);

      document.getElementById("secretCodeInput").addEventListener("keydown", function (event) {
        if (event.key === "Enter") {
          verifySecretCode();
        }

        if (event.key === "Escape") {
          closeSecretModal();
        }
      });

      document.getElementById("secretModal").addEventListener("click", function (event) {
        if (event.target === this) {
          closeSecretModal();
        }
      });

      /* =========================================
   SAVE ATTENDANCE
========================================= */

      function saveAttendance(student, status) {
        console.log("Saving attendance:", student.row, status);

        const callbackName = "attendanceCallback_" + Date.now();

        window[callbackName] = function (response) {
          console.log("Attendance response:", response);

          if (!response || response.success !== true) {
            alert(
              response && response.message
                ? response.message
                : "Attendance save হয়নি।",
            );

            delete window[callbackName];

            return;
          }

          /* =========================
               UPDATE LOCAL DATA
            ========================= */

          const studentIndex = students.findIndex(function (item) {
            return Number(item.row) === Number(student.row);
          });

          if (studentIndex !== -1) {
            students[studentIndex].attendance = status;
          }

          updateSummary();

          renderStudents();

          delete window[callbackName];
        };

        const script = document.createElement("script");

        script.src =
          GOOGLE_SCRIPT_URL +
          "?action=attendance" +
          "&row=" +
          encodeURIComponent(student.row) +
          "&status=" +
          encodeURIComponent(status) +
          "&callback=" +
          callbackName +
          "&_=" +
          Date.now();

        script.onerror = function () {
          alert("Google Sheet-এ attendance save করা যায়নি।");

          delete window[callbackName];
        };

        document.body.appendChild(script);
      }

      /* =========================================
   UPDATE SUMMARY
========================================= */

      function updateSummary() {
        const total = students.length;

        const present = students.filter(function (student) {
          return student.attendance === "Present";
        }).length;

        const absent = students.filter(function (student) {
          return student.attendance === "Absent";
        }).length;

        const totalElement = document.getElementById("totalCount");

        const presentElement = document.getElementById("presentCount");

        const absentElement = document.getElementById("absentCount");

        if (totalElement) {
          totalElement.textContent = total;
        }

        if (presentElement) {
          presentElement.textContent = present;
        }

        if (absentElement) {
          absentElement.textContent = absent;
        }
      }

      /* =========================================
   SEARCH
========================================= */

      const searchInput = document.getElementById("searchInput");

      if (searchInput) {
        searchInput.addEventListener("input", function (event) {
          searchText = event.target.value.trim().toLowerCase();

          renderStudents();
        });
      }

      /* =========================================
   FILTER BUTTONS
========================================= */

/* =========================================
   FILTER BUTTONS
========================================= */

const filterButtons = document.querySelectorAll(".filter-btn");

filterButtons.forEach(function (button) {

    button.addEventListener("click", function () {

        // সব button থেকে active remove
        filterButtons.forEach(function (btn) {
            btn.classList.remove("active");
        });

        // যেটাতে click করা হয়েছে সেটাকে active
        button.classList.add("active");

        // Button-এর data-filter অনুযায়ী filter সেট
        currentFilter = button.dataset.filter;

        // Student list আবার render
        renderStudents();
    });

});

      /* =========================================
   ERROR
========================================= */

      function showError(message) {
        const error = document.getElementById("error");

        if (!error) {
          return;
        }

        error.textContent = message;

        error.style.display = "block";
      }

      /* =========================================
   HTML SECURITY
========================================= */

      function escapeHTML(value) {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      /* =========================================
   START
========================================= */

      document.addEventListener("DOMContentLoaded", function () {
        loadStudents();
      });


      const allAbsentBtn = document.getElementById("allAbsentBtn");

allAbsentBtn.addEventListener("click", () => {

    // Secret code চাইবে
    const secretCode = prompt("Enter Secret Code:");

    // Cancel করলে কিছুই হবে না
    if (secretCode === null) {
        return;
    }

    // Secret code যাচাই
    if (secretCode !== "2511") {
        alert("❌ Wrong Secret Code!");
        return;
    }

    // সঠিক code হলে সবাইকে Absent করা
    students.forEach(student => {
        student.attendance = "Absent";
    });

    // Absent filter active করা
    currentFilter = "absent";

    document.querySelectorAll(".filter-btn").forEach(btn => {
        btn.classList.remove("active");
    });

    absentBtn.classList.add("active");

    // Student list ও count update
    renderStudents();
    updateCounts();

    alert("✅ All students are now Absent!");
});


    </script>
